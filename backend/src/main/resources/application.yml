spring:
  datasource:
    url: jdbc:mysql://localhost:3306/kiosk_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    # 실제 비밀번호는 코드에 직접 넣지 않고 MYSQL_PASSWORD 환경변수로 주입
    password: ${MYSQL_PASSWORD:your_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        # 지연로딩 컬렉션(Order.items 등)을 N개의 개별 쿼리 대신 IN절로 묶어 배치 조회 -> N+1 방지
        default_batch_fetch_size: 100

  sql:
    init:
      mode: never   # 초기 데이터는 data.sql 자동 실행 대신 수동 실행 권장

server:
  port: 8080

logging:
  level:
    com.kiosk: DEBUG

toss:
  # 토스페이먼츠 개발자센터(https://developers.tosspayments.com)에서 회원가입 후
  # 발급받은 "테스트 시크릿 키"를 TOSS_SECRET_KEY 환경변수로 주입하세요.
  # 사업자등록/계좌 연동 없이 무료로 발급되며, 실제 결제는 발생하지 않습니다.
  secret-key: ${TOSS_SECRET_KEY:}

cors:
  # 아이패드 등 다른 기기에서 테스트할 때만 ALLOWED_ORIGINS 환경변수에
  # "http://192.168.x.x:3000" 형태로 추가하세요(콤마로 여러 개 구분 가능).
  # 실제 키오스크 배포 시에는 프론트/백엔드가 한 기기 안에서 동작하므로 기본값(localhost)이면 충분합니다.
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
