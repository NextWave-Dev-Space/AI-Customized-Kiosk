spring:
  datasource:
    url: jdbc:mysql://localhost:3306/kiosk_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: your_password   # MySQL 비밀번호로 변경하세요
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  sql:
    init:
      mode: never   # 초기 데이터는 data.sql 자동 실행 대신 수동 실행 권장

server:
  port: 8080

logging:
  level:
    com.kiosk: DEBUG
